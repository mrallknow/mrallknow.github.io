<body>
    <div class="container">
        <div class="logo">
            <img src="./assets/logo.png" alt="Mr. All Know Logo">
        </div>
        <div class="subtitle">
            <p>Science, Maths, Philosophy, Bad Puns & Truth. Documenting My Learnings and Original Thoughts Here.</p>

        <div class="subscribe-form">

                method="POST" target="hidden_iframe" target="hidden_iframe" onsubmit="handleSubmit(event);">
                <div class="nes-field form-group">
                    <input id="email" type="email" class="nes-input is-dark" name="entry.1178951186"
                        placeholder="Shares random cool ideas" required>
                    <button type="submit" class="subscribe-btn nes-btn is-error">Subscribe</button>

                </div>
            </form>
            <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"
                onload="showDialog();"></iframe>

            <!-- NES.css dialog -->
            <dialog class="nes-dialog is-rounded" id="successDialog">
                <form method="dialog">
                    <p class="title">You're now subscribed!</p>
                    <p>I will be sharing random cool ideas about everything.</p>
                    <menu class="dialog-menu">
                        <button class="nes-btn is-primary">Fantastic!</button>

        <div class="buttons-container">

    <script>
        function handleSubmit(event) {
            event.preventDefault(); // Prevent default form submission behavior
            var emailField = document.getElementById('email');

            // Submit the form
            event.target.submit();

            // Set submitted to true after the form is submitted
            submitted = true;

            // Clear the email input field
            emailField.value = '';
        }

        function showDialog() {
            if (submitted) {
                var dialog = document.getElementById('successDialog');
                dialog.showModal(); // Show the dialog box
                submitted = false; // Reset the submitted variable
            }
        }
    </script>
    <script src="https://kit.fontawesome.com/1783be87ce.js" crossorigin="anonymous"></script>
